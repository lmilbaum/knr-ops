# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: bootstrap-rs

on:
  push:
    branches: [main]
    paths:
      - "bootstrap-rs/**"
      - ".github/workflows/bootstrap-rs.yml"
  pull_request:
    paths:
      - "bootstrap-rs/**"
      - ".github/workflows/bootstrap-rs.yml"

permissions:
  contents: read

concurrency:
  group: bootstrap-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bootstrap-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # rustup respects bootstrap-rs/rust-toolchain.toml, so the pinned
      # toolchain (channel, clippy, rustfmt) installs on first cargo use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bootstrap-rs/target
          key: bootstrap-rs-${{ runner.os }}-${{ hashFiles('bootstrap-rs/Cargo.lock', 'bootstrap-rs/rust-toolchain.toml') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked
